<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Scanner Buy</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --warn: #fbbf24;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    header h1 { font-size: 1.1rem; margin: 0; letter-spacing: 0.2px; }

    .cart-badge {
      background: var(--accent);
      color: #052e16;
      font-weight: 800;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.98rem;
      cursor: pointer;
    }

    .camera-box {
      position: relative;
      width: 100%;
      height: 36vh;
      min-height: 230px;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 86%;
      height: 44%;
      transform: translate(-50%, -50%);
      border: 2px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.48);
      pointer-events: none;
    }

    .reticle-label {
      position: absolute;
      top: -24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.78rem;
      color: #e2e8f0;
      text-shadow: 0 1px 2px #000;
    }

    .status-pill {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    main {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .zoom-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .zoom-row input[type="range"] {
      flex: 1;
      padding: 0;
      accent-color: var(--accent);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.05s ease;
    }
    button:active { transform: scale(0.98); }

    .btn-primary { background: var(--accent); color: #052e16; }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-secondary.active { background: #2563eb; color: #fff; }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 10px; font-size: 0.8rem; }

    .btn-add-cart {
      width: 100%;
      padding: 15px 16px;
      font-size: 1.15rem;
      letter-spacing: 0.2px;
      border-radius: 12px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      border: 1px solid #334155;
    }

    .result-highlight {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }

    .unit-price {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--accent);
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 86px;
      gap: 8px;
      margin-bottom: 10px;
    }

    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }

    input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
    }

    .notice-box {
      font-size: 0.84rem;
      line-height: 1.35;
      padding: 9px 11px;
      border-radius: 9px;
      margin-bottom: 10px;
      background: rgba(15, 23, 42, 0.75);
      border-left: 3px solid var(--warn);
      color: #fde68a;
    }

    .notice-box.ok {
      border-left-color: var(--accent);
      color: #a7f3d0;
    }

    .notice-box.err {
      border-left-color: var(--danger);
      color: #fecaca;
    }

    .raw-ocr {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.75;
    }

    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .cart-item-sub { font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body>

  <header>
    <h1>🛒 Scanner Buy</h1>
    <div class="cart-badge" onclick="document.getElementById('cartSection').scrollIntoView({behavior:'smooth'})">
      Totale: <span id="headerTotal">0,00 €</span>
    </div>
  </header>

  <div class="camera-box" onclick="scanFrame()">
    <video id="video" autoplay playsinline muted></video>
    <div class="reticle">
      <div class="reticle-label">Inquadra solo prezzo e peso (tocca per leggere)</div>
    </div>
    <div class="status-pill" id="status">Avvio fotocamera...</div>
  </div>

  <main>
    <div class="controls">
      <button class="btn-primary" onclick="scanFrame()">📸 Leggi ora</button>
      <button class="btn-secondary" id="autoBtn" onclick="toggleAutoScan()">🔄 Auto-Scan: OFF</button>
    </div>

    <div class="zoom-row" id="zoomRow" style="display:none;">
      <span>Zoom: <strong id="zoomVal">1.0x</strong></span>
      <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1" oninput="applyZoom(this.value)" />
    </div>

    <div class="card">
      <div class="result-highlight">
        <span style="color: var(--muted); font-size: 0.9rem;">Prezzo al Kg / Litro</span>
        <span class="unit-price" id="unitPriceDisplay">-- €/kg</span>
      </div>

      <div class="inputs-grid">
        <div>
          <label for="priceInput">Prezzo (€)</label>
          <input type="number" id="priceInput" step="0.01" placeholder="2.49" oninput="recalculate()" />
        </div>
        <div>
          <label for="weightInput">Peso / Vol. (opz.)</label>
          <input type="number" id="weightInput" step="any" placeholder="es. 500" oninput="recalculate()" />
        </div>
        <div>
          <label for="unitSelect">Unità</label>
          <select id="unitSelect" onchange="recalculate()">
            <option value="g">g</option>
            <option value="kg">kg</option>
            <option value="ml">ml</option>
            <option value="l">L</option>
          </select>
        </div>
      </div>

      <div class="notice-box" id="noticeBox">
        Inquadra un cartellino oppure inserisci il prezzo per aggiungere al carrello.
      </div>

      <div style="margin-bottom: 12px;">
        <input type="text" id="nameInput" placeholder="Nome prodotto (opzionale)" />
      </div>

      <button class="btn-primary btn-add-cart" onclick="addToCart()">+ Aggiungi al carrello</button>
      <div class="raw-ocr" id="rawText">OCR: in attesa</div>
    </div>

    <div class="card" id="cartSection">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>Carrello (<span id="cartCount">0</span>)</strong>
        <button class="btn-danger" onclick="clearCart()">Svuota</button>
      </div>
      <div class="cart-list" id="cartList"></div>
    </div>
  </main>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');

    let worker = null;
    let videoTrack = null;
    let isScanning = false;
    let autoScanInterval = null;
    let cart = JSON.parse(localStorage.getItem('scanner_buy_cart') || '[]');

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0] || null;
        setupZoomIfSupported();

        statusEl.textContent = 'Caricamento OCR...';
        worker = await Tesseract.createWorker('ita');
        await worker.setParameters({
          tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT,
          tessedit_char_whitelist: '0123456789.,€eEkKgGmMlLxX×/'
        });
        statusEl.textContent = 'Scanner Buy pronto';
      } catch (err) {
        statusEl.textContent = 'Errore camera: ' + err.message;
      }
    }

    function setupZoomIfSupported() {
      if (!videoTrack || !videoTrack.getCapabilities) return;
      const caps = videoTrack.getCapabilities();
      if (caps.zoom) {
        const slider = document.getElementById('zoomSlider');
        slider.min = caps.zoom.min || 1;
        slider.max = Math.min(caps.zoom.max || 3, 4);
        slider.step = caps.zoom.step || 0.1;
        slider.value = videoTrack.getSettings().zoom || slider.min;
        document.getElementById('zoomVal').textContent = `${Number(slider.value).toFixed(1)}x`;
        document.getElementById('zoomRow').style.display = 'flex';
      }
    }

    async function applyZoom(val) {
      document.getElementById('zoomVal').textContent = `${Number(val).toFixed(1)}x`;
      if (!videoTrack || !videoTrack.applyConstraints) return;
      try {
        await videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] });
      } catch (_) {}
    }

    async function scanFrame() {
      if (!worker || isScanning || video.readyState !== 4) return;
      isScanning = true;
      statusEl.textContent = 'Lettura in corso...';

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      const cropW = Math.floor(vw * 0.86);
      const cropH = Math.floor(vh * 0.44);
      const cropX = Math.floor((vw - cropW) / 2);
      const cropY = Math.floor((vh - cropH) / 2);

      // Upscale 1.6x per rendere i numeri più leggibili a Tesseract
      const scale = 1.6;
      canvas.width = Math.floor(cropW * scale);
      canvas.height = Math.floor(cropH * scale);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);

      // Contrasto morbido in scala di grigi (conserva virgole e punti)
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imgData.data;
      const contrast = 1.35;
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        let val = (gray - 128) * contrast + 128;
        val = Math.max(0, Math.min(255, val));
        d[i] = d[i + 1] = d[i + 2] = val;
      }
      ctx.putImageData(imgData, 0, 0);

      try {
        const { data: { text } } = await worker.recognize(canvas);
        const cleanLine = text.replace(/\s+/g, ' ').trim();
        document.getElementById('rawText').textContent = 'OCR: ' + (cleanLine || 'nessun testo');
        parseLabelText(text);
        statusEl.textContent = 'Lettura completata';
      } catch (e) {
        statusEl.textContent = 'Errore OCR';
        updateNotice('err', 'Lettura non riuscita: avvicina il mirino o inserisci il prezzo a mano.');
      } finally {
        isScanning = false;
      }
    }

    function updateNotice(type, msg) {
      const box = document.getElementById('noticeBox');
      box.className = 'notice-box' + (type ? ' ' + type : '');
      box.textContent = msg;
    }

    function parseLabelText(raw) {
      // Normalizza virgole, apostrofi e spazi attorno ai decimali (es. "2 , 89" -> "2.89")
      const text = raw
        .toLowerCase()
        .replace(/['’]/g, '.')
        .replace(/(\d)\s*[,.\s]\s*(\d{2})\b/g, '$1.$2')
        .replace(/,/g, '.');

      const multiMatch = text.match(/(\d+)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(kg|gr|g|ml|cl|l)\b/);
      const weightMatch = text.match(/(?:^|[^a-z])e?\s*(\d+(?:\.\d+)?)\s*(kg|gr|g|ml|cl|l)\b/);

      let foundWeight = false;
      if (multiMatch) {
        applyWeight(parseFloat(multiMatch[1]) * parseFloat(multiMatch[2]), multiMatch[3]);
        foundWeight = true;
      } else if (weightMatch) {
        applyWeight(parseFloat(weightMatch[1]), weightMatch[2]);
        foundWeight = true;
      }

      // Cerca prezzi con 2 decimali; se non ci sono decimali ma c'è un numero es. "289" dopo € o isolato, prova a gestirlo con cautela
      let priceMatches = [...text.matchAll(/(?:€|eur)?\s*(\d{1,3}\.\d{2})(?!\d)/g)]
        .map(m => parseFloat(m[1]))
        .filter(n => n > 0.05 && n < 500);

      let foundPrice = false;
      if (priceMatches.length > 0) {
        const weightVal = parseFloat(document.getElementById('weightInput').value);
        const unit = document.getElementById('unitSelect').value;
        const isUnderOneKg = (unit === 'g' || unit === 'ml') && weightVal > 0 && weightVal < 1000;

        const chosenPrice = (priceMatches.length > 1 && isUnderOneKg)
          ? Math.min(...priceMatches)
          : priceMatches[0];

        document.getElementById('priceInput').value = chosenPrice.toFixed(2);
        foundPrice = true;
      }

      recalculate();

      if (!foundPrice && !foundWeight) {
        updateNotice('err', 'Non ho letto prezzo né peso: prova a mettere a fuoco solo il prezzo/peso o inseriscili a mano.');
      } else if (!foundPrice) {
        updateNotice('err', 'Prezzo non letto chiaramente: controlla la riga OCR qui sotto o scrivi il prezzo.');
      } else if (!foundWeight) {
        updateNotice('', 'Peso/volume non letto: puoi aggiungere al carrello oppure scrivere peso/volume per il prezzo al kg.');
      } else {
        updateNotice('ok', 'Valori letti. Verifica e premi + Aggiungi al carrello.');
      }
    }

    function applyWeight(val, rawUnit) {
      let unit = rawUnit === 'gr' ? 'g' : rawUnit;
      if (unit === 'cl') {
        val = val * 10;
        unit = 'ml';
      }
      document.getElementById('weightInput').value = val;
      document.getElementById('unitSelect').value = unit;
    }

    function recalculate() {
      const price = parseFloat(document.getElementById('priceInput').value);
      const weight = parseFloat(document.getElementById('weightInput').value);
      const unit = document.getElementById('unitSelect').value;
      const display = document.getElementById('unitPriceDisplay');

      if (!price || price <= 0) {
        display.textContent = '-- €/kg';
        return { valid: false, price: 0, weight: null, unit, unitPrice: null, labelUnit: unit === 'ml' || unit === 'l' ? 'L' : 'kg' };
      }

      if (!weight || weight <= 0) {
        display.textContent = '-- €/kg';
        return { valid: true, price, weight: null, unit, unitPrice: null, labelUnit: unit === 'ml' || unit === 'l' ? 'L' : 'kg' };
      }

      let normalizedKgOrL = weight;
      let labelUnit = 'kg';

      if (unit === 'g') { normalizedKgOrL = weight / 1000; labelUnit = 'kg'; }
      if (unit === 'kg') { normalizedKgOrL = weight; labelUnit = 'kg'; }
      if (unit === 'ml') { normalizedKgOrL = weight / 1000; labelUnit = 'L'; }
      if (unit === 'l') { normalizedKgOrL = weight; labelUnit = 'L'; }

      const unitPrice = price / normalizedKgOrL;
      display.textContent = `${unitPrice.toFixed(2).replace('.', ',')} €/${labelUnit}`;
      return { valid: true, price, weight, unit, unitPrice, labelUnit };
    }

    function toggleAutoScan() {
      const btn = document.getElementById('autoBtn');
      if (autoScanInterval) {
        clearInterval(autoScanInterval);
        autoScanInterval = null;
        btn.textContent = '🔄 Auto-Scan: OFF';
        btn.classList.remove('active');
      } else {
        scanFrame();
        autoScanInterval = setInterval(scanFrame, 1800);
        btn.textContent = '🔄 Auto-Scan: ON';
        btn.classList.add('active');
      }
    }

    function addToCart() {
      const calc = recalculate();
      if (!calc || !calc.valid) {
        updateNotice('err', 'Manca il prezzo (€): inserisci o leggi il prezzo per aggiungere il prodotto al carrello.');
        return;
      }
      const name = document.getElementById('nameInput').value.trim() || `Prodotto ${cart.length + 1}`;
      cart.unshift({ id: Date.now(), name, ...calc });
      saveAndRenderCart();

      document.getElementById('nameInput').value = '';
      document.getElementById('weightInput').value = '';
      document.getElementById('priceInput').value = '';
      recalculate();
      updateNotice('ok', `"${name}" aggiunto al carrello.`);
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function removeItem(id) {
      cart = cart.filter(item => item.id !== id);
      saveAndRenderCart();
    }

    function clearCart() {
      if (cart.length === 0) return;
      cart = [];
      saveAndRenderCart();
    }

    function saveAndRenderCart() {
      localStorage.setItem('scanner_buy_cart', JSON.stringify(cart));
      const list = document.getElementById('cartList');
      list.innerHTML = '';

      let total = 0;
      cart.forEach(item => {
        total += item.price;
        const unitInfo = (item.weight && item.unitPrice)
          ? `${item.weight} ${item.unit} (${item.unitPrice.toFixed(2).replace('.', ',')} €/${item.labelUnit})`
          : 'Peso non indicato';
        const row = document.createElement('div');
        row.className = 'cart-item';
        row.innerHTML = `
          <div>
            <div><strong>${item.name}</strong> — ${item.price.toFixed(2).replace('.', ',')} €</div>
            <div class="cart-item-sub">${unitInfo}</div>
          </div>
          <button class="btn-danger" onclick="removeItem(${item.id})">✕</button>
        `;
        list.appendChild(row);
      });

      document.getElementById('cartCount').textContent = cart.length;
      document.getElementById('headerTotal').textContent = `${total.toFixed(2).replace('.', ',')} €`;
    }

    saveAndRenderCart();
    initCamera();
  </script>
</body>
</html>

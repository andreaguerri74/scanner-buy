<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Prezzo al Kg & Carrello</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --accent-dark: #059669;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    header h1 { font-size: 1.05rem; margin: 0; }

    .cart-badge {
      background: var(--accent);
      color: #052e16;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .camera-box {
      position: relative;
      width: 100%;
      height: 36vh;
      min-height: 230px;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Riquadro mirino centrale */
    .reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 78%;
      height: 46%;
      transform: translate(-50%, -50%);
      border: 2px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    .reticle-label {
      position: absolute;
      top: -24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.78rem;
      color: #e2e8f0;
      text-shadow: 0 1px 2px #000;
    }

    .status-pill {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    main {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.05s ease;
    }
    button:active { transform: scale(0.98); }

    .btn-primary { background: var(--accent); color: #052e16; }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-secondary.active { background: #2563eb; color: #fff; }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 10px; font-size: 0.8rem; }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      border: 1px solid #334155;
    }

    .result-highlight {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }

    .unit-price {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--accent);
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 90px;
      gap: 8px;
      margin-bottom: 10px;
    }

    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }

    input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
    }

    .raw-ocr {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 8px;
      word-break: break-word;
    }

    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .cart-item-sub { font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body>

  <header>
    <h1>🛒 Scanner Prezzo/Kg</h1>
    <div class="cart-badge" onclick="document.getElementById('cartSection').scrollIntoView({behavior:'smooth'})">
      Totale: <span id="headerTotal">0,00 €</span>
    </div>
  </header>

  <div class="camera-box" onclick="scanFrame()">
    <video id="video" autoplay playsinline muted></video>
    <div class="reticle">
      <div class="reticle-label">Inquadra prezzo e peso (tocca per leggere)</div>
    </div>
    <div class="status-pill" id="status">Avvio fotocamera...</div>
  </div>

  <main>
    <div class="controls">
      <button class="btn-primary" onclick="scanFrame()">📸 Leggi ora</button>
      <button class="btn-secondary" id="autoBtn" onclick="toggleAutoScan()">🔄 Auto-Scan: OFF</button>
    </div>

    <div class="card">
      <div class="result-highlight">
        <span style="color: var(--muted); font-size: 0.9rem;">Prezzo al Kg / Litro</span>
        <span class="unit-price" id="unitPriceDisplay">-- €/kg</span>
      </div>

      <div class="inputs-grid">
        <div>
          <label for="priceInput">Prezzo (€)</label>
          <input type="number" id="priceInput" step="0.01" placeholder="2.49" oninput="recalculate()" />
        </div>
        <div>
          <label for="weightInput">Peso / Vol.</label>
          <input type="number" id="weightInput" step="1" placeholder="350" oninput="recalculate()" />
        </div>
        <div>
          <label for="unitSelect">Unità</label>
          <select id="unitSelect" onchange="recalculate()">
            <option value="g">g</option>
            <option value="kg">kg</option>
            <option value="ml">ml</option>
            <option value="l">L</option>
          </select>
        </div>
      </div>

      <div style="margin-bottom: 10px;">
        <input type="text" id="nameInput" placeholder="Nome prodotto (opzionale, es. Pasta)" />
      </div>

      <button class="btn-primary" style="width: 100%;" onclick="addToCart()">+ Aggiungi al carrello</button>
      <div class="raw-ocr" id="rawText">Testo rilevato: nessuno</div>
    </div>

    <div class="card" id="cartSection">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>Carrello (<span id="cartCount">0</span>)</strong>
        <button class="btn-danger" onclick="clearCart()">Svuota</button>
      </div>
      <div class="cart-list" id="cartList"></div>
    </div>
  </main>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');

    let worker = null;
    let isScanning = false;
    let autoScanInterval = null;
    let cart = JSON.parse(localStorage.getItem('supermarket_cart') || '[]');

    // 1. Avvia fotocamera posteriore
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
          audio: false
        });
        video.srcObject = stream;
        statusEl.textContent = 'Caricamento motore OCR...';
        worker = await Tesseract.createWorker('ita');
        statusEl.textContent = 'Pronto — inquadra il cartellino';
      } catch (err) {
        statusEl.textContent = 'Errore camera (serve HTTPS): ' + err.message;
      }
    }

    // 2. Cattura solo il riquadro centrale + pre-processing ad alto contrasto
    async function scanFrame() {
      if (!worker || isScanning || video.readyState !== 4) return;
      isScanning = true;
      statusEl.textContent = 'Lettura in corso...';

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      // Ritaglio corrispondente al mirino centrale
      const cropW = Math.floor(vw * 0.78);
      const cropH = Math.floor(vh * 0.46);
      const cropX = Math.floor((vw - cropW) / 2);
      const cropY = Math.floor((vh - cropH) / 2);

      canvas.width = cropW;
      canvas.height = cropH;
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      // Scala di grigi + aumento contrasto per migliorare lettura numeri
      const imgData = ctx.getImageData(0, 0, cropW, cropH);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const contrasted = gray > 135 ? 255 : (gray < 85 ? 0 : gray);
        d[i] = d[i + 1] = d[i + 2] = contrasted;
      }
      ctx.putImageData(imgData, 0, 0);

      try {
        const { data: { text } } = await worker.recognize(canvas);
        document.getElementById('rawText').textContent = 'Letto: ' + text.replace(/\n+/g, ' ').trim();
        parseLabelText(text);
        statusEl.textContent = 'Lettura completata';
      } catch (e) {
        statusEl.textContent = 'Errore OCR';
      } finally {
        isScanning = false;
      }
    }

    // 3. Estrae prezzo e peso/volume dal testo del cartellino
    function parseLabelText(raw) {
      const text = raw.toLowerCase().replace(/,/g, '.');

      // Cerca formati multipack es. "2x100g" o "3 x 250 ml"
      const multiMatch = text.match(/(\d+)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(kg|gr|g|ml|cl|l)\b/);
      // Cerca peso singolo es. "350 g", "1.5 kg", "750 ml"
      const weightMatch = text.match(/\b(\d+(?:\.\d+)?)\s*(kg|gr|g|ml|cl|l)\b/);

      if (multiMatch) {
        const qty = parseFloat(multiMatch[1]);
        const val = parseFloat(multiMatch[2]);
        applyWeight(qty * val, multiMatch[3]);
      } else if (weightMatch) {
        applyWeight(parseFloat(weightMatch[1]), weightMatch[2]);
      }

      // Cerca tutti i prezzi con due decimali (es. 2.49, 12.90)
      const priceMatches = [...text.matchAll(/(?:€|eur)?\s*(\d{1,3}\.\d{2})(?!\d)/g)]
        .map(m => parseFloat(m[1]))
        .filter(n => n > 0 && n < 500);

      if (priceMatches.length > 0) {
        // Sui cartellini spesso ci sono 2 prezzi: quello del prodotto (più basso) e quello al kg (più alto)
        // Se il peso è < 1 kg, il prezzo prodotto è di norma il valore più piccolo
        const weightVal = parseFloat(document.getElementById('weightInput').value);
        const unit = document.getElementById('unitSelect').value;
        const isUnderOneKg = (unit === 'g' || unit === 'ml') && weightVal < 1000;

        const chosenPrice = (priceMatches.length > 1 && isUnderOneKg)
          ? Math.min(...priceMatches)
          : priceMatches[0];

        document.getElementById('priceInput').value = chosenPrice.toFixed(2);
      }

      recalculate();
    }

    function applyWeight(val, rawUnit) {
      let unit = rawUnit === 'gr' ? 'g' : rawUnit;
      if (unit === 'cl') {
        val = val * 10;
        unit = 'ml';
      }
      document.getElementById('weightInput').value = val;
      document.getElementById('unitSelect').value = unit;
    }

    // 4. Calcolo prezzo al kg / litro
    function recalculate() {
      const price = parseFloat(document.getElementById('priceInput').value);
      const weight = parseFloat(document.getElementById('weightInput').value);
      const unit = document.getElementById('unitSelect').value;
      const display = document.getElementById('unitPriceDisplay');

      if (!price || !weight || weight <= 0) {
        display.textContent = '-- €/kg';
        return null;
      }

      let normalizedKgOrL = weight;
      let labelUnit = 'kg';

      if (unit === 'g') { normalizedKgOrL = weight / 1000; labelUnit = 'kg'; }
      if (unit === 'kg') { normalizedKgOrL = weight; labelUnit = 'kg'; }
      if (unit === 'ml') { normalizedKgOrL = weight / 1000; labelUnit = 'L'; }
      if (unit === 'l') { normalizedKgOrL = weight; labelUnit = 'L'; }

      const unitPrice = price / normalizedKgOrL;
      display.textContent = `${unitPrice.toFixed(2).replace('.', ',')} €/${labelUnit}`;
      return { price, weight, unit, unitPrice, labelUnit };
    }

    function toggleAutoScan() {
      const btn = document.getElementById('autoBtn');
      if (autoScanInterval) {
        clearInterval(autoScanInterval);
        autoScanInterval = null;
        btn.textContent = '🔄 Auto-Scan: OFF';
        btn.classList.remove('active');
      } else {
        scanFrame();
        autoScanInterval = setInterval(scanFrame, 1800);
        btn.textContent = '🔄 Auto-Scan: ON';
        btn.classList.add('active');
      }
    }

    // 5. Gestione carrello
    function addToCart() {
      const calc = recalculate();
      if (!calc) {
        alert('Inserisci o scansiona un prezzo e un peso validi.');
        return;
      }
      const name = document.getElementById('nameInput').value.trim() || `Prodotto ${cart.length + 1}`;
      cart.unshift({ id: Date.now(), name, ...calc });
      saveAndRenderCart();

      // Pulizia rapida per il prossimo prodotto
      document.getElementById('nameInput').value = '';
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function removeItem(id) {
      cart = cart.filter(item => item.id !== id);
      saveAndRenderCart();
    }

    function clearCart() {
      if (cart.length === 0) return;
      cart = [];
      saveAndRenderCart();
    }

    function saveAndRenderCart() {
      localStorage.setItem('supermarket_cart', JSON.stringify(cart));
      const list = document.getElementById('cartList');
      list.innerHTML = '';

      let total = 0;
      cart.forEach(item => {
        total += item.price;
        const row = document.createElement('div');
        row.className = 'cart-item';
        row.innerHTML = `
          <div>
            <div><strong>${item.name}</strong> — ${item.price.toFixed(2).replace('.', ',')} €</div>
            <div class="cart-item-sub">${item.weight} ${item.unit} (${item.unitPrice.toFixed(2).replace('.', ',')} €/${item.labelUnit})</div>
          </div>
          <button class="btn-danger" onclick="removeItem(${item.id})">✕</button>
        `;
        list.appendChild(row);
      });

      document.getElementById('cartCount').textContent = cart.length;
      document.getElementById('headerTotal').textContent = `${total.toFixed(2).replace('.', ',')} €`;
    }

    saveAndRenderCart();
    initCamera();
  </script>
</body>
</html>
